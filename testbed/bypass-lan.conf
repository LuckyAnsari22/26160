bypass-lan {
    # Disabled for this testbed: bypass-lan auto-bypasses (sends in cleartext)
    # any traffic within a subnet that's locally connected to an interface.
    # moon and sun sit on the SAME Docker subnet (net-wan, 10.0.0.0/24) as
    # each other, so with this plugin loaded, ALL traffic between them -
    # including the transport-mode SA's own protected traffic - gets bypassed
    # instead of encrypted. Verified directly: `ip xfrm policy` showed only a
    # broad `10.0.0.0/24 <-> 10.0.0.0/24` bypass policy and no SA-specific
    # policy took effect; `ip xfrm state` was empty despite swanctl reporting
    # the child SA as INSTALLED. This is a real-world non-issue (peers are
    # essentially never on the same L2 segment as each other in production),
    # but this lab topology deliberately puts both endpoints on one bridge
    # network, so it must be disabled here specifically.
    load = no
}
