
services:
  alice:
    image: alpine:3.19
    container_name: alice
    command: >
      sh -c "apk add --no-cache iproute2 tcpdump iputils iperf3 python3 curl && ip route add 192.168.2.0/24 via 192.168.1.1 && ip -6 route add fd02::/64 via fd01::1 2>/dev/null || true && echo 'Endpoint ready' && tail -f /dev/null"
    networks:
      net-alice:
        ipv4_address: 192.168.1.10
        ipv6_address: fd01::10
    cap_add:
      - NET_ADMIN

  moon:
    build: .
    container_name: moon
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - ./configs/active/moon-swanctl.conf:/etc/swanctl/conf.d/tunnel.conf:ro
    networks:
      net-alice:
        ipv4_address: 192.168.1.1
        ipv6_address: fd01::1
      net-wan:
        ipv4_address: 10.0.0.1
        ipv6_address: fd00::1

  sun:
    build: .
    container_name: sun
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - ./configs/active/sun-swanctl.conf:/etc/swanctl/conf.d/tunnel.conf:ro
    networks:
      net-wan:
        ipv4_address: 10.0.0.2
        ipv6_address: fd00::2
      net-bob:
        ipv4_address: 192.168.2.1
        ipv6_address: fd02::1

  bob:
    image: alpine:3.19
    container_name: bob
    command: >
      sh -c "apk add --no-cache iproute2 tcpdump iputils iperf3 python3 curl && ip route add 192.168.1.0/24 via 192.168.2.1 && ip -6 route add fd01::/64 via fd02::1 2>/dev/null || true && echo 'Endpoint ready' && tail -f /dev/null"
    networks:
      net-bob:
        ipv4_address: 192.168.2.10
        ipv6_address: fd02::10
    cap_add:
      - NET_ADMIN

networks:
  net-alice:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.254
        - subnet: fd01::/64
          gateway: fd01::254
    driver_opts:
      com.docker.network.driver.mtu: 1360
  net-wan:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 10.0.0.0/24
          gateway: 10.0.0.254
        - subnet: fd00::/64
          gateway: fd00::254
    driver_opts:
      com.docker.network.driver.mtu: 1360
  net-bob:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 192.168.2.0/24
          gateway: 192.168.2.254
        - subnet: fd02::/64
          gateway: fd02::254
    driver_opts:
      com.docker.network.driver.mtu: 1360
