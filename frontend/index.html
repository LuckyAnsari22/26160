<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity IPsec Analyzer Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        .tab-active { border-bottom: 2px solid #3b82f6; color: #1d4ed8; font-weight: 600; }
        .tab-inactive { color: #64748b; font-weight: 500; }
        .tab-inactive:hover { color: #3b82f6; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Dashboard = () => {
            const [activeTab, setActiveTab] = useState('ciso');
            const [file, setFile] = useState(null);
            const [isUploading, setIsUploading] = useState(false);
            const [results, setResults] = useState(null);
            const [error, setError] = useState(null);

            const API_BASE = "http://localhost:8000/api/v1";

            const handleFileUpload = async (e) => {
                e.preventDefault();
                if (!file) return;
                
                setIsUploading(true);
                setError(null);
                const formData = new FormData();
                formData.append("file", file);

                try {
                    const uploadRes = await fetch(`${API_BASE}/analyze`, {
                        method: 'POST',
                        body: formData
                    });
                    const uploadData = await uploadRes.json();
                    
                    // Poll for results (mocked as instant here)
                    setTimeout(async () => {
                        const resultRes = await fetch(`${API_BASE}/results/${uploadData.analysis_id}`);
                        const resultData = await resultRes.json();
                        setResults(resultData);
                        setIsUploading(false);
                    }, 1000);
                    
                } catch (err) {
                    setError("Failed to connect to API. Is FastAPI running on port 8000?");
                    setIsUploading(false);
                }
            };

            // Small helper: every section of main.py's real response carries its
            // own `status` (assessed/indeterminate/unavailable/classified/error),
            // and the fields that exist depend entirely on which status it is.
            // This renders a neutral "why there's nothing to show" card instead
            // of accessing a field that doesn't exist for that status - which is
            // what crashed the whole page before (countermeasures, shap_explanation,
            // findings, predicted_class were all read unconditionally).
            const NotAvailableCard = ({ title, reason }) => (
                <div className="bg-white p-6 rounded-lg shadow-sm border border-gray-100">
                    <h3 className="text-sm font-semibold text-gray-500 uppercase tracking-wider">{title}</h3>
                    <div className="mt-2 text-lg font-semibold text-gray-400">Not available</div>
                    <p className="text-sm text-gray-500 mt-2">{reason}</p>
                </div>
            );

            const renderCISOView = () => {
                if (!results) return null;
                const compliance = results.compliance;
                const classification = results.classification;
                // countermeasures live under classification (only present when
                // classification.status === 'classified') - main.py never sends
                // a top-level results.countermeasures at all.
                const countermeasures = classification.countermeasures;

                return (
                    <div className="space-y-6">
                        <div className="grid grid-cols-3 gap-4">
                            {compliance.status === 'assessed' ? (
                                <div className="bg-white p-6 rounded-lg shadow-sm border border-gray-100">
                                    <h3 className="text-sm font-semibold text-gray-500 uppercase tracking-wider">Overall Risk Score</h3>
                                    <div className="mt-2 text-4xl font-bold text-red-600">{100 - compliance.score}/100</div>
                                    <p className="text-sm text-gray-500 mt-2">
                                        {compliance.threat_matrix.length > 0
                                            ? `${compliance.threat_matrix.length} finding(s) capping the score`
                                            : 'No capping findings'}
                                    </p>
                                    {compliance.caveats && compliance.caveats.map((c, i) => (
                                        <p key={i} className="text-xs text-amber-600 mt-2">⚠ {c}</p>
                                    ))}
                                </div>
                            ) : (
                                <NotAvailableCard title="Overall Risk Score" reason={compliance.reason} />
                            )}

                            {classification.status === 'classified' ? (
                                <div className="bg-white p-6 rounded-lg shadow-sm border border-gray-100">
                                    <h3 className="text-sm font-semibold text-gray-500 uppercase tracking-wider">Traffic Leakage</h3>
                                    <div className="mt-2 text-4xl font-bold text-orange-500">{classification.confidence}%</div>
                                    <p className="text-sm text-gray-500 mt-2">Adversary certainty of {classification.predicted_class} traffic</p>
                                </div>
                            ) : (
                                <NotAvailableCard title="Traffic Leakage" reason={classification.reason} />
                            )}

                            {classification.status === 'classified' && countermeasures ? (
                                <div className="bg-white p-6 rounded-lg shadow-sm border border-gray-100">
                                    <h3 className="text-sm font-semibold text-gray-500 uppercase tracking-wider">Recommended Fix</h3>
                                    <div className="mt-2 text-4xl font-bold text-green-600">Adaptive</div>
                                    <p className="text-sm text-gray-500 mt-2">Drops leak to {countermeasures.adaptive_confidence}% for {countermeasures.adaptive_overhead_pct}% BW cost</p>
                                </div>
                            ) : (
                                <NotAvailableCard title="Recommended Fix" reason={classification.reason || "Requires a successful classification first."} />
                            )}
                        </div>

                        <div className="bg-white p-6 rounded-lg shadow-sm border border-gray-100">
                            <h3 className="text-lg font-bold text-gray-800 mb-4">Countermeasure Cost-Benefit Analysis</h3>
                            <img src={`${API_BASE}/assets/padding_tradeoff_curve.png`} alt="Tradeoff Curve" className="w-full max-w-2xl mx-auto border rounded" />
                        </div>
                    </div>
                );
            };

            const renderSOCView = () => {
                if (!results) return null;
                const classification = results.classification;

                if (classification.status !== 'classified') {
                    return (
                        <div className="bg-gray-50 border-l-4 border-gray-400 p-4">
                            <h3 className="text-sm font-medium text-gray-700">No traffic classification available</h3>
                            <p className="mt-2 text-sm text-gray-600">{classification.reason}</p>
                        </div>
                    );
                }

                return (
                    <div className="space-y-6">
                        <div className="bg-red-50 border-l-4 border-red-500 p-4">
                            <div className="flex">
                                <div className="ml-3">
                                    <h3 className="text-sm font-medium text-red-800">High Confidence Traffic Alert: {classification.predicted_class.toUpperCase()}</h3>
                                    <div className="mt-2 text-sm text-red-700">
                                        <p>Adversary Confidence: {classification.confidence}%</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-white p-6 rounded-lg shadow-sm border border-gray-100">
                            <h3 className="text-lg font-bold text-gray-800 mb-4">Flow Characteristics</h3>
                            <p className="text-sm text-gray-600 mb-4">
                                Why did the model classify this as {classification.predicted_class}? 
                                These are the actual SPLT flow statistics the classifier saw for this capture, along with SHAP explanations.
                            </p>
                            <div className="grid grid-cols-2 gap-4">
                                <div className="bg-gray-50 p-4 rounded">
                                    <div className="text-xs text-gray-500 uppercase">Packet Count</div>
                                    <div className="text-xl font-semibold text-gray-800">{classification.flow_stats.pkt_count}</div>
                                </div>
                                <div className="bg-gray-50 p-4 rounded">
                                    <div className="text-xs text-gray-500 uppercase">Mean Packet Length</div>
                                    <div className="text-xl font-semibold text-gray-800">{classification.flow_stats.mean_len.toFixed(1)} B</div>
                                </div>
                                <div className="bg-gray-50 p-4 rounded">
                                    <div className="text-xs text-gray-500 uppercase">Mean Inter-Arrival Time</div>
                                    <div className="text-xl font-semibold text-gray-800">{(classification.flow_stats.mean_iat * 1000).toFixed(1)} ms</div>
                                </div>
                                <div className="bg-gray-50 p-4 rounded">
                                    <div className="text-xs text-gray-500 uppercase">Direction Ratio</div>
                                    <div className="text-xl font-semibold text-gray-800">{classification.flow_stats.direction_ratio.toFixed(2)}</div>
                                </div>
                            </div>
                            {classification.shap_explanation ? (
                                <div className="mt-6">
                                    <h4 className="text-md font-bold text-gray-700 mb-3">Live SHAP Explanation</h4>
                                    <div className="space-y-2">
                                        {classification.shap_explanation.top_features.map((tf, i) => (
                                            <div key={i} className="flex items-center text-sm">
                                                <div className="w-1/4 font-medium text-gray-600 truncate">{tf.feature}</div>
                                                <div className="w-1/4 text-gray-500 text-right pr-4">{tf.actual_value.toFixed(2)}</div>
                                                <div className="w-1/2 flex items-center">
                                                    <div style={{
                                                        width: `${Math.min(Math.abs(tf.shap_value) * 100, 100)}%`, 
                                                        height: '16px',
                                                        backgroundColor: tf.shap_value >= 0 ? '#10b981' : '#ef4444'
                                                    }}></div>
                                                    <span className="ml-2 text-xs text-gray-500">{tf.shap_value.toFixed(3)}</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ) : (
                                <div>
                                    <p className="text-xs text-gray-400 mt-4">
                                        Reference SHAP summary from model training (aggregate feature importance across the
                                        training set, not specific to this request):
                                    </p>
                                    <img src={`${API_BASE}/assets/shap_waterfall_voip.png`} alt="SHAP Waterfall (training-time reference)" className="w-full max-w-md border rounded mt-2" />
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            const renderAuditorView = () => {
                if (!results) return null;
                const compliance = results.compliance;

                if (compliance.status !== 'assessed') {
                    return (
                        <div className="bg-gray-50 border-l-4 border-gray-400 p-4">
                            <h3 className="text-sm font-medium text-gray-700">Compliance could not be assessed</h3>
                            <p className="mt-2 text-sm text-gray-600">{compliance.reason}</p>
                        </div>
                    );
                }

                return (
                    <div className="space-y-6">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-lg font-bold text-gray-800">NIST SP 800-77 Compliance Breakdown</h3>
                            <button className="bg-green-600 text-white px-4 py-2 rounded shadow text-sm font-medium hover:bg-green-700 transition">
                                Export PDF Report
                            </button>
                        </div>
                        {compliance.caveats && compliance.caveats.length > 0 && (
                            <div className="bg-amber-50 border-l-4 border-amber-400 p-4">
                                {compliance.caveats.map((c, i) => (
                                    <p key={i} className="text-sm text-amber-800">⚠ {c}</p>
                                ))}
                            </div>
                        )}
                        <div className="bg-white shadow overflow-hidden sm:rounded-md">
                            <ul className="divide-y divide-gray-200">
                                {compliance.findings.map((f, i) => (
                                    <li key={i} className="px-6 py-4">
                                        <div className="flex items-center justify-between">
                                            <div className="flex items-center">
                                                <span className={`px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${f.severity === 'HIGH' ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800'}`}>
                                                    {f.severity}
                                                </span>
                                                <p className="ml-4 text-sm font-medium text-gray-900">{f.message}</p>
                                            </div>
                                            <div className="text-sm text-gray-500">
                                                Severity Cap: {f.cap_applied}
                                            </div>
                                        </div>
                                    </li>
                                ))}
                            </ul>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen">
                    <header className="bg-slate-900 text-white p-4 shadow-md">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <h1 className="text-xl font-bold tracking-tight">AI-Powered IPsec Protocol Analyzer</h1>
                            <div className="text-sm text-slate-300">Smart India Hackathon (PS 26160)</div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto p-6 mt-4">
                        {!results ? (
                            <div className="bg-white p-8 rounded-lg shadow-sm border border-gray-200 max-w-xl mx-auto text-center">
                                <h2 className="text-2xl font-bold text-gray-800 mb-6">Upload PCAP for Analysis</h2>
                                <form onSubmit={handleFileUpload} className="space-y-4">
                                    <div className="border-2 border-dashed border-gray-300 rounded-lg p-6 hover:border-blue-500 transition">
                                        <input type="file" onChange={(e) => setFile(e.target.files[0])} className="w-full" accept=".pcap,.pcapng" />
                                    </div>
                                    <button type="submit" disabled={!file || isUploading} className={`w-full py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white ${!file || isUploading ? 'bg-gray-400' : 'bg-blue-600 hover:bg-blue-700'}`}>
                                        {isUploading ? 'Analyzing Pipeline...' : 'Run Analysis'}
                                    </button>
                                </form>
                                {error && <p className="text-red-500 mt-4 text-sm">{error}</p>}
                            </div>
                        ) : results.status === 'error' ? (
                            // main.py returns {status:"error", filename, error} with NO
                            // compliance/classification keys at all for an invalid or
                            // empty pcap - the tabs below assume those keys exist, so
                            // this case is handled separately rather than falling
                            // through into them.
                            <div className="bg-white p-8 rounded-lg shadow-sm border border-red-200 max-w-xl mx-auto text-center">
                                <h2 className="text-xl font-bold text-red-700 mb-2">Analysis Failed</h2>
                                <p className="text-sm text-gray-600">{results.error}</p>
                                <button onClick={() => setResults(null)} className="mt-6 text-blue-600 hover:text-blue-800 text-sm font-medium">Try Another File</button>
                            </div>
                        ) : (
                            <div>
                                <div className="flex border-b border-gray-200 mb-6 space-x-8">
                                    <button onClick={() => setActiveTab('ciso')} className={`pb-4 px-2 ${activeTab === 'ciso' ? 'tab-active' : 'tab-inactive'}`}>CISO Executive View</button>
                                    <button onClick={() => setActiveTab('soc')} className={`pb-4 px-2 ${activeTab === 'soc' ? 'tab-active' : 'tab-inactive'}`}>SOC Analyst View</button>
                                    <button onClick={() => setActiveTab('auditor')} className={`pb-4 px-2 ${activeTab === 'auditor' ? 'tab-active' : 'tab-inactive'}`}>Compliance Auditor View</button>
                                </div>
                                
                                {activeTab === 'ciso' && renderCISOView()}
                                {activeTab === 'soc' && renderSOCView()}
                                {activeTab === 'auditor' && renderAuditorView()}
                                
                                <div className="mt-8 pt-4 border-t border-gray-200 text-center">
                                    <button onClick={() => setResults(null)} className="text-blue-600 hover:text-blue-800 text-sm font-medium">Analyze Another File</button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
